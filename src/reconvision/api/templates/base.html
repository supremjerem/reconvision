<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>{% block title %}ReconVision{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}" />
    <script src="{{ url_for('static', path='/htmx.min.js') }}" defer></script>
  </head>
  <body>
    <header class="masthead">
      <h1 class="wordmark">Recon<span>Vision</span></h1>
      <nav class="nav">
        <a href="/" {% if page == 'review' %}aria-current="page"{% endif %}>events</a>
        <a href="/people" {% if page == 'people' %}aria-current="page"{% endif %}>people</a>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
